name: API Tests with Allure Report

on:
  push:
    branches: [ "master", "TestAPI" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          echo "🐋 Installing Docker Compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Clone application repository
        run: |
          echo "📥 Cloning application repository..."
          git clone https://github.com/bondarenkokate73/simbirsoft_sdet_project.git app-repo
          cd app-repo
          echo "📁 Application structure:"
          ls -la

      - name: Fix migration issue
        run: |
          echo "🔧 Fixing migration issue..."
          cd app-repo
          # Проверяем и исправляем команду миграции
          if grep -q "up, 3" docker-compose.yml; then
            echo "🔄 Fixing migrate command..."
            sed -i 's/command: \["-path", "\/migrations", "-database", "postgres:\/\/\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:\${POSTGRES_PORT}\/\${POSTGRES_DB}?sslmode=disable", "up", "3"\]/command: ["-path", "\/migrations", "-database", "postgres:\/\/\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:5432\/\${POSTGRES_DB}?sslmode=disable", "up"]/' docker-compose.yml
          fi
          cat docker-compose.yml | grep -A5 "migrate:"

      - name: Start database and migrations
        run: |
          echo "🐘 Starting database and migrations..."
          cd app-repo
          # Сначала запускаем только postgres
          docker-compose up -d postgres
          sleep 10
          
          # Проверяем, что Postgres готов
          for i in {1..10}; do
            if docker-compose exec -T postgres pg_isready -U $POSTGRES_USER; then
              echo "✅ Postgres is ready"
              break
            fi
            echo "Waiting for Postgres... $i/10"
            sleep 5
          done
          
          # Запускаем миграции
          echo "🔄 Running migrations..."
          docker-compose up migrate
          
          # Проверяем статус миграций
          if [ $? -eq 0 ]; then
            echo "✅ Migrations completed successfully"
          else
            echo "⚠️ Migrations had issues, but continuing..."
          fi

      - name: Start application service
        run: |
          echo "🚀 Starting application service..."
          cd app-repo
          docker-compose up -d service
          
          # Даем приложению время на запуск
          sleep 20

      - name: Check application status
        run: |
          echo "🔍 Checking application status..."
          cd app-repo
          echo "📊 Running containers:"
          docker-compose ps
          
          echo "🔍 Service logs:"
          docker-compose logs service --tail=50
          
          echo "🔍 Checking network:"
          docker network ls

      - name: Wait for application to be ready
        run: |
          echo "⏳ Waiting for application to be ready..."
          cd app-repo
          
          # Улучшенная проверка готовности
          for i in {1..40}; do
            # Проверяем, что контейнер работает
            if ! docker-compose ps service | grep -q "Up"; then
              echo "❌ Service container is not running"
              docker-compose logs service
              exit 1
            fi
          
            # Пробуем разные эндпоинты
            if curl -s -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Application is responding on port 8080!"
              break
            fi
          
            if curl -s -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health endpoint is responding!"
              break
            fi
          
            if curl -s -f http://localhost:8080/api > /dev/null 2>&1; then
              echo "✅ API endpoint is responding!"
              break
            fi
          
            echo "Attempt $i/40 - Application not ready..."
            sleep 5
          done
          
          # Финальная проверка
          if curl -s -f http://localhost:8080 > /dev/null; then
            echo "🎉 Application is ready for testing!"
          else
            echo "❌ Application failed to start properly"
            echo "📋 Final container status:"
            docker-compose ps -a
            echo "🔍 Final service logs:"
            docker-compose logs service
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run API tests
        run: |
          echo "🧪 Running API tests..."
          mvn clean test -Dbase.url=http://localhost:8080/api
        continue-on-error: true

      - name: Stop all services
        if: always()
        run: |
          echo "🛑 Stopping all services..."
          cd app-repo
          docker-compose down

      - name: Prepare Allure results
        if: always()
        run: |
          echo "📊 Preparing Allure results..."
          mkdir -p allure-results
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            cp -r target/allure-results/* allure-results/
            echo "✅ Test results copied"
          else
            echo "⚠️ No test results found"
          fi

      - name: Generate and Publish Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 5