name: API Tests with Allure Report

on:
  push:
    branches: [ "TestAPI" ]
  pull_request:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Start Test Application (if available)
        run: |
          # Попытка запустить тестовое приложение, если оно есть в проекте
          if [ -f "docker-compose.yml" ]; then
            docker-compose up -d
            sleep 30
          elif [ -f "start.sh" ]; then
            chmod +x start.sh
            ./start.sh &
            sleep 30
          else
            echo "No application setup found - tests will run against mock/stub"
          fi

      - name: Run API tests
        run: |
          # Запускаем тесты, но разрешаем им падать если приложение не доступно
          mvn clean test -Dbase.url=http://localhost:8080/api || echo "Tests may fail if application is not running"

        # Всегда продолжаем, чтобы сгенерировать отчет даже при падении тестов
        continue-on-error: true

      - name: Generate Allure results
        run: |
          mkdir -p allure-results
          # Копируем результаты даже если тесты упали
          cp -r target/allure-results/* allure-results/ 2>/dev/null || echo "No test results found"

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history