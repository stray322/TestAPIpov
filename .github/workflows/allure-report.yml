name: API Tests with Allure Report

on:
  push:
    branches: [ "master", "TestAPI" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          echo "🐋 Installing Docker Compose..."
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Clone application repository
        run: |
          echo "📥 Cloning application repository..."
          git clone https://github.com/bondarenkokate73/simbirsoft_sdet_project.git app-repo
          cd app-repo
          echo "📁 Application structure:"
          ls -la
          echo "✅ docker-compose.yaml found"

      - name: Fix migration issue in docker-compose
        run: |
          echo "🔧 Fixing migration command in docker-compose.yaml..."
          cd app-repo
          
          # Исправляем команду миграции - убираем "3" в конце
          if grep -q 'command: \["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable", "up", "3"\]' docker-compose.yaml; then
            sed -i 's/command: \["-path", "\/migrations", "-database", "postgres:\/\/\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:\${POSTGRES_PORT}\/\${POSTGRES_DB}?sslmode=disable", "up", "3"\]/command: ["-path", "\/migrations", "-database", "postgres:\/\/\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:5432\/\${POSTGRES_DB}?sslmode=disable", "up"]/' docker-compose.yaml
            echo "✅ Migration command fixed"
          else
            echo "ℹ️ Migration command already correct or different format"
          fi
          
          # Показываем исправленную секцию migrate
          echo "📋 Updated migrate section:"
          grep -A5 "migrate:" docker-compose.yaml

      - name: Start database and wait for readiness
        run: |
          echo "🐘 Starting database..."
          cd app-repo
          docker-compose up -d postgres
          
          # Ждем готовности PostgreSQL
          echo "⏳ Waiting for PostgreSQL to be ready..."
          for i in {1..20}; do
            if docker-compose exec -T postgres pg_isready -U ${{ secrets.POSTGRES_USER }}; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... $i/20"
            sleep 3
          done

      - name: Run migrations
        run: |
          echo "🔄 Running database migrations..."
          cd app-repo
          # Запускаем миграции и игнорируем ошибки (продолжаем в любом случае)
          docker-compose up migrate || echo "⚠️ Migrations completed with warnings, but continuing..."

      - name: Start application service
        run: |
          echo "🚀 Starting application service..."
          cd app-repo
          docker-compose up -d service
          sleep 15

      - name: Check services status
        run: |
          echo "🔍 Checking services status..."
          cd app-repo
          echo "📊 Running containers:"
          docker-compose ps
          echo "🔍 Application logs:"
          docker-compose logs service --tail=20

      - name: Wait for application to be ready
        run: |
          echo "⏳ Waiting for application to be ready..."
          cd app-repo
          
          for i in {1..30}; do
            # Проверяем различные возможные эндпоинты
            if curl -s -f http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health endpoint is responding!"
              break
            fi
          
            if curl -s -f http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "✅ API health endpoint is responding!"
              break
            fi
          
            if curl -s -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Root endpoint is responding!"
              break
            fi
          
            if curl -s -f http://localhost:8080/api > /dev/null 2>&1; then
              echo "✅ API endpoint is responding!"
              break
            fi
          
            echo "Attempt $i/30 - Application not ready..."
            sleep 5
          done
          
          # Финальная проверка
          if curl -s -f http://localhost:8080 > /dev/null; then
            echo "🎉 Application is ready for testing!"
          else
            echo "❌ Application failed to respond"
            echo "📋 Final check - container status:"
            docker-compose ps -a
            echo "🔍 Final application logs:"
            docker-compose logs service
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run API tests
        run: |
          echo "🧪 Running API tests against the application..."
          mvn clean test -Dbase.url=http://localhost:8080/api
        continue-on-error: true

      - name: Stop all services
        if: always()
        run: |
          echo "🛑 Stopping all services..."
          cd app-repo
          docker-compose down

      - name: Prepare Allure results
        if: always()
        run: |
          echo "📊 Preparing Allure results..."
          mkdir -p allure-results
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            cp -r target/allure-results/* allure-results/
            echo "✅ Test results copied"
          else
            echo "⚠️ No test results found"
          fi

      - name: Generate and Publish Allure report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 5